{% extends 'base.html' %}
{% block title %}Comment Update{% endblock %}

{% block content %}
<h1>Comment 수정 화면</h1>

<form
  action="{% url 'posts:comment-update' post.id comment.id %}"
  method="POST"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <div>{{ form.as_p }}</div>
  <div>
    <input type="submit" value="수정">
  </div>
</form>
{% endblock %}
