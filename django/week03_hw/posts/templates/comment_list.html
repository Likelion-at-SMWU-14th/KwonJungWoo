{% extends 'base.html' %} {% block title %}Comment List{% endblock %}

{% block content %}
<h1>Comment 목록 화면</h1>
{% for comment in comments %}
    <div>
    <hr>
        <p>게시글 : {{comment.post}}</p>
        <p>댓글 작성자 : {{comment.writer}}</p>
        <p>댓글 내용 : {{comment.content}}</p>
        <a href="{% url 'posts:comment-update' post.id comment.id %}">댓글 수정</a>
    </div>
{% endfor %}
{% endblock %}
