<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독서 기록장</title>
</head>
<body>

    <h1>📚 독서 기록장</h1>

    <hr>

    {% for book in books %}
        <div>
            <h3>{{ book.name }}</h3>
            <p>저자 : {{ book.author }}</p>
            <p>평점 : ⭐️ {{ book.rate }}</p>
        </div>

        <hr>
    {% endfor %}

</body>
</html>
